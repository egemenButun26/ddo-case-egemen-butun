  /kiosk/payments:
    post:
      operationId: postKioskPayment
      summary: Kiosk ödemesi başlat
      description: |
        Oturum için ödeme kaydı oluşturur ve sağlayıcıya bildirir.
        `Idempotency-Key` zorunludur (en çok 255 karakter). Aynı anahtar ve aynı
        gövde ile tekrar gönderim 200 ve `replayed: true` döner. Kamera anahtarı ister.
      tags:
        - Ödeme/Kapı
      security:
        - cameraKey: []
      x-roles:
        - camera
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Ödeme oluşturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskPaymentResponse'
        '200':
          description: Aynı idempotency anahtarıyla tekrar gönderim (replay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskPaymentResponse'
        '400':
          description: Idempotency anahtarı ya da gövde geçersiz (`idempotency_key_required`, `invalid_json`, `invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Kamera anahtarı eksik ya da geçersiz (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Oturum yok ya da açık değil (`session_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Idempotency çakışması, tutar uyuşmazlığı, borç yok ya da bekleyen ödeme
            (`idempotency_conflict`, `amount_mismatch`, `nothing_due`, `payment_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Gövde çok büyük (`payload_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: İçerik türü JSON değil (`unsupported_media_type`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Sunucu hatası (`internal`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
