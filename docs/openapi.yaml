openapi: 3.1.0
info:
  title: ParkAkıl API
  version: 1.0.0
  description: |
    ParkAkıl otopark yönetim API'si. Bütün para alanları kuruş cinsinden
    `integer` (`int64`) olarak taşınır. Kimlik doğrulama, `POST /auth/login`
    ile alınan sunucu taraflı oturum token'ının `Authorization: Bearer <token>`
    başlığıyla gönderilmesiyle yapılır.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: API'ye doğrudan erişim
  - url: http://localhost:3000/api
    description: Web uygulaması üzerinden erişim (proxy)
tags:
  - name: Sağlık
    description: Servis durumu, metrikler ve makine okunabilir dokümantasyon.
  - name: Kimlik
    description: Oturum açma, kullanıcı bilgisi ve kullanıcı yönetimi.
  - name: Kamera
    description: Kamera olaylarının alınması.
  - name: Oturum/Doluluk
    description: Otopark, doluluk, son olaylar, inceleme kuyruğu ve rezervasyonlar.
  - name: Ödeme/Kapı
    description: Kiosk ödemeleri, sağlayıcı bildirimleri, kapı kararları ve borçlar.
  - name: Abonelik/Fatura
    description: Abonelik planları, abonelikler, faturalar ve dönem sonu işlemleri.
  - name: Raporlar
    description: Günlük rapor ve sağlayıcı mutabakatı.
  - name: Yönetim
    description: Kara liste, sayaç düzeltme ve kayma kayıtları.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `POST /auth/login` yanıtındaki `token`. Sunucu taraflı oturum token'ıdır;
        `Authorization: Bearer <token>` biçiminde gönderilir.
    cameraKey:
      type: apiKey
      in: header
      name: X-Camera-Key
      description: Kamera, kiosk ve kapı istemcileri için paylaşılan anahtar.
    metricsToken:
      type: http
      scheme: bearer
      description: Metrik ucu için ayrı bearer token.
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: |
        Ödeme sağlayıcısının istek gövdesi üzerinde HMAC-SHA256 ile ürettiği
        imza. Biçim: `sha256=<hex>`. Sunucu, gizli anahtarla aynı gövdeyi imzalayıp
        sabit zamanlı karşılaştırma yapar.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Pozitif tam sayı kimlik.
    AfterID:
      name: after_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      description: Bu kimlikten sonraki kayıtları getirir.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Sayfa başına kayıt sayısı (1-100).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
      description: Aynı isteğin tekrarını ayırt eden istemci anahtarı.
  schemas:
    Error:
      type: object
      description: Bütün hata yanıtlarının ortak gövdesi.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Makine okunabilir hata kodu.
            message:
              type: string
              description: İnsan okunabilir hata mesajı.
    HealthResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          const: ok
        checks:
          type: object
          additionalProperties:
            type: string
          description: Bileşen adından durumuna eşleme.
          example:
            database: ok
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginUser:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    LoginResponse:
      type: object
      required:
        - token
        - expires_at
        - user
      properties:
        token:
          type: string
          description: Sunucu taraflı oturum token'ı.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/LoginUser'
    Role:
      type: string
      enum:
        - driver
        - attendant
        - accountant
        - manager
        - admin
    UserView:
      type: object
      required:
        - id
        - email
        - name
        - role
        - plate
        - active
        - created_at
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        plate:
          type: [string, "null"]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    AdminUsersResponse:
      type: object
      required:
        - items
        - next_after_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserView'
        next_after_id:
          $ref: '#/components/schemas/NextAfterID'
    CameraEventRequest:
      type: object
      required:
        - lot_id
        - camera_id
        - camera_event_id
        - direction
        - captured_at
      properties:
        lot_id:
          type: integer
          format: int64
        camera_id:
          type: string
          maxLength: 128
        camera_event_id:
          type: string
          maxLength: 128
        direction:
          type: string
          enum:
            - entry
            - exit
        plate_raw:
          type: string
          maxLength: 64
        captured_at:
          type: string
          format: date-time
    CameraEventResponse:
      type: object
      required:
        - event_id
        - outcome
        - session_id
        - review_id
        - amount_kurus
        - replayed
        - closed_by_orphan_exit
      properties:
        event_id:
          type: integer
          format: int64
        outcome:
          type: string
          enum:
            - opened
            - duplicate_entry
            - closed
            - duplicate_exit
            - orphan_exit
            - review
        session_id:
          type: [integer, "null"]
          format: int64
        review_id:
          type: [integer, "null"]
          format: int64
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
        replayed:
          type: boolean
        closed_by_orphan_exit:
          type: boolean
    Kurus:
      type: integer
      format: int64
      description: Kuruş cinsinden para tutarı.
    NextAfterID:
      type: [integer, "null"]
      format: int64
      description: Bir sonraki sayfa için `after_id` olarak gönderilecek kimlik.
    NextBeforeID:
      type: [integer, "null"]
      format: int64
      description: Bir sonraki sayfa için `before_id` olarak gönderilecek kimlik.
    LotView:
      type: object
      required:
        - id
        - code
        - name
        - capacity
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        capacity:
          type: integer
    OccupancyView:
      type: object
      required:
        - lot_id
        - code
        - capacity
        - occupied
        - active_reservations
        - available
      properties:
        lot_id:
          type: integer
          format: int64
        code:
          type: string
        capacity:
          type: integer
        occupied:
          type: integer
        active_reservations:
          type: integer
        available:
          type: integer
    RecentEventView:
      type: object
      required:
        - id
        - lot_id
        - direction
        - plate_raw
        - plate_norm
        - captured_at
        - outcome
        - session_id
      properties:
        id:
          type: integer
          format: int64
        lot_id:
          type: integer
          format: int64
        direction:
          type: string
        plate_raw:
          type: string
        plate_norm:
          type: string
        captured_at:
          type: string
          format: date-time
        outcome:
          type: string
        session_id:
          type: [integer, "null"]
          format: int64
    RecentEventsResponse:
      type: object
      required:
        - items
        - next_before_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecentEventView'
        next_before_id:
          $ref: '#/components/schemas/NextBeforeID'
    ReviewView:
      type: object
      required:
        - id
        - event_id
        - lot_id
        - reason
        - read_plate
        - status
        - created_at
        - resolved_at
        - suggested_session_id
        - plate_raw
        - plate_norm
        - captured_at
      properties:
        id:
          type: integer
          format: int64
        event_id:
          type: integer
          format: int64
        lot_id:
          type: integer
          format: int64
        reason:
          type: string
        read_plate:
          type: string
        status:
          type: string
          enum:
            - open
            - resolved
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        suggested_session_id:
          type: [integer, "null"]
          format: int64
        plate_raw:
          type: string
        plate_norm:
          type: string
        captured_at:
          type: string
          format: date-time
    ReviewsResponse:
      type: object
      required:
        - items
        - next_after_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewView'
        next_after_id:
          $ref: '#/components/schemas/NextAfterID'
    ResolveReviewRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - dismiss
            - link_session
        session_id:
          type: integer
          format: int64
          description: '`action` = `link_session` iken zorunlu ve pozitif olmalı.'
    ResolveReviewResponse:
      type: object
      required:
        - id
        - status
        - resolved_at
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          const: resolved
        resolved_at:
          type: string
          format: date-time
    BlacklistView:
      type: object
      required:
        - id
        - plate
        - reason
        - active
        - created_by
        - created_at
        - removed_at
      properties:
        id:
          type: integer
          format: int64
        plate:
          type: string
        reason:
          type: string
        active:
          type: boolean
        created_by:
          type: [integer, "null"]
          format: int64
        created_at:
          type: string
          format: date-time
        removed_at:
          type: [string, "null"]
          format: date-time
    BlacklistListResponse:
      type: object
      required:
        - items
        - next_after_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlacklistView'
        next_after_id:
          $ref: '#/components/schemas/NextAfterID'
    CreateBlacklistRequest:
      type: object
      required:
        - plate
        - reason
      properties:
        plate:
          type: string
        reason:
          type: string
    CreateReservationRequest:
      type: object
      required:
        - lot_id
        - plate
      properties:
        lot_id:
          type: integer
          format: int64
        plate:
          type: string
    ReservationView:
      type: object
      required:
        - id
        - lot_id
        - plate
        - status
        - reserved_at
        - expires_at
        - replayed
      properties:
        id:
          type: integer
          format: int64
        lot_id:
          type: integer
          format: int64
        plate:
          type: string
        status:
          type: string
          enum:
            - active
            - arrived
            - released
            - cancelled
        reserved_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        replayed:
          type: boolean
          description: Aynı idempotency anahtarıyla tekrar istendi mi?
    RecountResponse:
      type: object
      required:
        - stored
        - recomputed
        - drifted
        - corrected
      properties:
        stored:
          type: integer
        recomputed:
          type: integer
        drifted:
          type: boolean
        corrected:
          type: boolean
    CounterDriftView:
      type: object
      required:
        - id
        - lot_id
        - stored
        - recomputed
        - detected_at
        - corrected
      properties:
        id:
          type: integer
          format: int64
        lot_id:
          type: integer
          format: int64
        stored:
          type: integer
        recomputed:
          type: integer
        detected_at:
          type: string
          format: date-time
        corrected:
          type: boolean
    CounterDriftsResponse:
      type: object
      required:
        - items
        - next_after_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CounterDriftView'
        next_after_id:
          $ref: '#/components/schemas/NextAfterID'
    DailyReportResponse:
      type: object
      required:
        - day
        - lot_id
        - entries
        - exits
        - closed_sessions
        - total_amount_kurus
        - collected_kurus
        - open_debt_kurus
        - open_reviews
      properties:
        day:
          type: string
          format: date
        lot_id:
          type: integer
          format: int64
        entries:
          type: integer
        exits:
          type: integer
        closed_sessions:
          type: integer
        total_amount_kurus:
          $ref: '#/components/schemas/Kurus'
        collected_kurus:
          $ref: '#/components/schemas/Kurus'
        open_debt_kurus:
          $ref: '#/components/schemas/Kurus'
        open_reviews:
          type: integer
    KioskQuoteResponse:
      type: object
      required:
        - session_id
        - plate
        - entered_at
        - total_kurus
        - paid_kurus
        - due_kurus
        - permit_expires_at
      properties:
        session_id:
          type: integer
          format: int64
        plate:
          type: string
        entered_at:
          type: string
          format: date-time
        total_kurus:
          $ref: '#/components/schemas/Kurus'
        paid_kurus:
          $ref: '#/components/schemas/Kurus'
        due_kurus:
          $ref: '#/components/schemas/Kurus'
        permit_expires_at:
          type: [string, "null"]
          format: date-time
    CreatePaymentRequest:
      type: object
      required:
        - session_id
        - amount_kurus
      properties:
        session_id:
          type: integer
          format: int64
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
    KioskPaymentResponse:
      type: object
      required:
        - payment_id
        - session_id
        - provider_ref
        - amount_kurus
        - status
        - replayed
      properties:
        payment_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        provider_ref:
          type: string
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - timed_out
        replayed:
          type: boolean
    ProviderNotificationRequest:
      type: object
      required:
        - provider_ref
        - outcome
        - amount_kurus
        - provider_at
      properties:
        provider_ref:
          type: string
        outcome:
          type: string
          enum:
            - succeeded
            - failed
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
        provider_at:
          type: string
          format: date-time
    ProviderNotificationResponse:
      type: object
      required:
        - payment_id
        - session_id
        - status
        - duplicate
        - late_approval
        - refund_required
        - refund_id
      properties:
        payment_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        status:
          type: string
        duplicate:
          type: boolean
        late_approval:
          type: boolean
        refund_required:
          type: boolean
        refund_id:
          type: [integer, "null"]
          format: int64
    GateDecisionResponse:
      type: object
      required:
        - action
        - reason
        - due_kurus
        - prior_debt_kurus
        - permit_expires_at
        - session_id
      properties:
        action:
          type: string
          enum:
            - open
            - deny
        reason:
          type: string
          enum:
            - no_match
            - low_confidence
            - prior_debt
            - no_charge
            - paid
            - permit_valid
            - permit_expired
            - payment_pending
            - payment_required
        due_kurus:
          $ref: '#/components/schemas/Kurus'
        prior_debt_kurus:
          $ref: '#/components/schemas/Kurus'
        permit_expires_at:
          type: [string, "null"]
          format: date-time
        session_id:
          type: [integer, "null"]
          format: int64
    PaymentView:
      type: object
      required:
        - id
        - session_id
        - amount_kurus
        - status
        - provider_ref
        - requested_at
        - paid_at
        - confirmed_at
        - late_approval
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - timed_out
        provider_ref:
          type: string
        requested_at:
          type: string
          format: date-time
        paid_at:
          type: [string, "null"]
          format: date-time
        confirmed_at:
          type: [string, "null"]
          format: date-time
        late_approval:
          type: boolean
    PaymentsResponse:
      type: object
      required:
        - items
        - next_after_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentView'
        next_after_id:
          $ref: '#/components/schemas/NextAfterID'
    RefundRequest:
      type: object
      required:
        - payment_id
        - amount_kurus
        - reason
      properties:
        payment_id:
          type: integer
          format: int64
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
        reason:
          type: string
          const: manual
          description: Manuel iade için yalnız `manual` kabul edilir.
    RefundView:
      type: object
      required:
        - id
        - payment_id
        - amount_kurus
        - status
        - reason
        - requested_at
        - replayed
      properties:
        id:
          type: integer
          format: int64
        payment_id:
          type: integer
          format: int64
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
        status:
          type: string
        reason:
          type: string
        requested_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    DebtView:
      type: object
      required:
        - id
        - session_id
        - lot_id
        - amount_kurus
        - paid_kurus
        - remaining_kurus
        - status
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        lot_id:
          type: integer
          format: int64
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
        paid_kurus:
          $ref: '#/components/schemas/Kurus'
        remaining_kurus:
          $ref: '#/components/schemas/Kurus'
        status:
          type: string
    DebtsResponse:
      type: object
      required:
        - plate
        - items
        - total_kurus
      properties:
        plate:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/DebtView'
        total_kurus:
          $ref: '#/components/schemas/Kurus'
    PlanView:
      type: object
      required:
        - id
        - code
        - lot_id
        - monthly_price_kurus
        - active
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        lot_id:
          type: integer
          format: int64
        monthly_price_kurus:
          $ref: '#/components/schemas/Kurus'
        active:
          type: boolean
    PlansResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanView'
    CreateSubscriptionRequest:
      type: object
      required:
        - plate
        - plan_code
      properties:
        plate:
          type: string
        plan_code:
          type: string
    SubscriptionView:
      type: object
      required:
        - id
        - plan_id
        - plan_code
        - monthly_price_kurus
        - lot_id
        - plate
        - user_id
        - status
        - current_period_start
        - current_period_end
        - cancelled_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        plan_id:
          type: integer
          format: int64
        plan_code:
          type: string
        monthly_price_kurus:
          $ref: '#/components/schemas/Kurus'
        lot_id:
          type: integer
          format: int64
        plate:
          type: string
        user_id:
          type: [integer, "null"]
          format: int64
        status:
          type: string
          enum:
            - active
            - past_due
            - suspended
            - cancelled
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SubscriptionsResponse:
      type: object
      required:
        - items
        - next_after_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionView'
        next_after_id:
          $ref: '#/components/schemas/NextAfterID'
    CancelSubscriptionResponse:
      type: object
      required:
        - subscription_id
        - status
        - credit_kurus
        - invoice_id
      properties:
        subscription_id:
          type: integer
          format: int64
        status:
          type: string
          const: cancelled
        credit_kurus:
          $ref: '#/components/schemas/Kurus'
        invoice_id:
          type: integer
          format: int64
    ChangePlanRequest:
      type: object
      required:
        - plan_code
      properties:
        plan_code:
          type: string
    ChangePlanResponse:
      type: object
      required:
        - subscription_id
        - new_plan_code
        - charge_kurus
        - credit_kurus
        - net_kurus
        - direction
        - charge_invoice_id
        - credit_invoice_id
      properties:
        subscription_id:
          type: integer
          format: int64
        new_plan_code:
          type: string
        charge_kurus:
          $ref: '#/components/schemas/Kurus'
        credit_kurus:
          $ref: '#/components/schemas/Kurus'
        net_kurus:
          $ref: '#/components/schemas/Kurus'
        direction:
          type: string
          enum:
            - upgrade
            - downgrade
            - even
        charge_invoice_id:
          type: integer
          format: int64
        credit_invoice_id:
          type: integer
          format: int64
    InvoiceView:
      type: object
      required:
        - id
        - subscription_id
        - period_start
        - period_end
        - kind
        - amount_kurus
        - status
        - attempts
        - next_retry_at
        - paid_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
        subscription_id:
          type: integer
          format: int64
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - period
            - proration_charge
            - proration_credit
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
        status:
          type: string
          enum:
            - open
            - paid
            - failed
            - void
        attempts:
          type: integer
        next_retry_at:
          type: [string, "null"]
          format: date-time
        paid_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    InvoicesResponse:
      type: object
      required:
        - items
        - next_after_id
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceView'
        next_after_id:
          $ref: '#/components/schemas/NextAfterID'
    PeriodEndRequest:
      type: object
      required:
        - period_start
      properties:
        period_start:
          type: string
          format: date
          description: Ayın ilk günü olmalı (`YYYY-MM-01`).
    PeriodEndResponse:
      type: object
      required:
        - invoices_created
      properties:
        invoices_created:
          type: integer
    PaymentAttemptRequest:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    PaymentAttemptResponse:
      type: object
      required:
        - invoice_id
        - subscription_id
        - status
        - attempts
        - next_retry_at
        - subscription_status
      properties:
        invoice_id:
          type: integer
          format: int64
        subscription_id:
          type: integer
          format: int64
        status:
          type: string
        attempts:
          type: integer
        next_retry_at:
          type: [string, "null"]
          format: date-time
        subscription_status:
          type: string
          enum:
            - active
            - past_due
            - suspended
            - cancelled
    ProviderSettlementRow:
      type: object
      required:
        - provider_ref
        - amount_kurus
      properties:
        provider_ref:
          type: string
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
    ReconciliationTxn:
      type: object
      required:
        - provider_ref
        - amount_kurus
      properties:
        provider_ref:
          type: string
        amount_kurus:
          $ref: '#/components/schemas/Kurus'
    ReconciliationAmountMismatch:
      type: object
      required:
        - provider_ref
        - ours_kurus
        - provider_kurus
      properties:
        provider_ref:
          type: string
        ours_kurus:
          $ref: '#/components/schemas/Kurus'
        provider_kurus:
          $ref: '#/components/schemas/Kurus'
    ReconciliationReport:
      type: object
      required:
        - matched
        - missing_in_provider
        - missing_in_ours
        - amount_mismatch
        - our_total_kurus
        - provider_total_kurus
        - diff_kurus
      properties:
        matched:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationTxn'
        missing_in_provider:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationTxn'
        missing_in_ours:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationTxn'
        amount_mismatch:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationAmountMismatch'
        our_total_kurus:
          $ref: '#/components/schemas/Kurus'
        provider_total_kurus:
          $ref: '#/components/schemas/Kurus'
        diff_kurus:
          $ref: '#/components/schemas/Kurus'
    ReconciliationImportResponse:
      type: object
      required:
        - imported
        - report
      properties:
        imported:
          type: integer
        report:
          $ref: '#/components/schemas/ReconciliationReport'
paths:
  /_hz/45a6:
    get:
      operationId: getHz
      summary: Ek sağlık ucu
      description: Standart sağlık ucuna ek olarak her zaman 200 döner. Kimlik doğrulaması istemez.
      tags:
        - Sağlık
      security: []
      x-roles: []
      responses:
        '200':
          description: Servis ayakta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /health:
    get:
      operationId: getHealth
      summary: Servis sağlık durumu
      description: Veritabanı erişimini denetler. Kimlik doğrulaması istemez.
      tags:
        - Sağlık
      security: []
      x-roles: []
      responses:
        '200':
          description: Servis ve bağımlılıkları sağlıklı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Veritabanına erişilemiyor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrikleri
      description: Metrik ucudur; ayrı bir bearer token ister.
      tags:
        - Sağlık
      security:
        - metricsToken: []
      x-roles: []
      responses:
        '200':
          description: Prometheus metin biçimi.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Token eksik ya da geçersiz (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /openapi.yaml:
    get:
      operationId: getOpenAPIDocument
      summary: OpenAPI dokümanı
      description: Bu dokümanı `application/yaml` olarak sunar. Kimlik doğrulaması istemez.
      tags:
        - Sağlık
      security: []
      x-roles: []
      responses:
        '200':
          description: OpenAPI 3.1 dokümanı.
          content:
            application/yaml:
              schema:
                type: string
  /camera-events:
    post:
      operationId: postCameraEvent
      summary: Kamera olayı gönder
      description: |
        Kamera giriş/çıkış olayını işler. Kamera anahtarı (`X-Camera-Key`) ister.
        Aynı `camera_event_id` tekrar gönderilirse sonuç `replayed: true` ve 200 döner.
      tags:
        - Kamera
      security:
        - cameraKey: []
      x-roles:
        - camera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraEventRequest'
      responses:
        '201':
          description: Olay işlendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEventResponse'
        '200':
          description: Aynı olay tekrar gönderildi (replay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEventResponse'
        '400':
          description: Gövde JSON değil (`invalid_json`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Kamera anahtarı eksik ya da geçersiz (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Otopark bulunamadı (`lot_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Olay çakışması (`event_conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Gövde çok büyük (`payload_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: İçerik türü JSON değil (`unsupported_media_type`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Olay doğrulaması başarısız (`invalid_event`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Sunucu hatası (`internal`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
