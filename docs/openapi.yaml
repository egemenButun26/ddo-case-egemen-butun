      description: |
        Sürücü yalnız kendi plakası için rezervasyon açabilir. Rezervasyon penceresi
        30 dakikadır. `Idempotency-Key` verilirse aynı anahtar ve aynı gövde 200 ve
        aynı kaydı (`replayed: true`), farklı gövde 409 `idempotency_conflict` döndürür.
      tags:
        - Oturum/Doluluk
      security:
        - bearerAuth: []
      x-roles:
        - driver
        - manager
        - admin
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '200':
          description: Aynı `Idempotency-Key` ve aynı gövdeyle tekrar istendi; aynı rezervasyon döndü.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationView'
        '201':
          description: Rezervasyon oluşturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationView'
        '400':
          description: Gövde ya da plaka geçersiz (`invalid_json`, `invalid_lot`, `invalid_plate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token yok ya da geçersiz (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sürücü başka plaka için rezervasyon açamaz (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Otopark yok (`lot_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Kapasite yok, rezervasyon var, açık oturum var ya da idempotency anahtarı farklı gövdeyle kullanılmış (`no_capacity`, `reservation_exists`, `open_session_exists`, `idempotency_conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Sunucu hatası (`internal`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
