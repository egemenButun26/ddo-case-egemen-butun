name: parkakil

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkakil}
      POSTGRES_USER: ${POSTGRES_USER:-parkakil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: parkakil-api:local
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-parkakil}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}@postgres:5432/${POSTGRES_DB:-parkakil}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: parkakil-api:local
    command: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-parkakil}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}@postgres:5432/${POSTGRES_DB:-parkakil}?sslmode=disable
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?SEED_DEMO_PASSWORD zorunlu}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: parkakil-api:local
    container_name: ddo-limon-api
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-parkakil}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}@postgres:5432/${POSTGRES_DB:-parkakil}?sslmode=disable
      CAMERA_API_KEY: ${CAMERA_API_KEY:?CAMERA_API_KEY zorunlu}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      DB_PING_TIMEOUT: ${DB_PING_TIMEOUT:-2s}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
      PROVIDER_URL: ${PROVIDER_URL:-http://providersim:8090}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:?PROVIDER_WEBHOOK_SECRET zorunlu}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-30s}
      PAYMENT_EXPIRE_INTERVAL: ${PAYMENT_EXPIRE_INTERVAL:-10s}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:8080}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s

  simulator:
    image: parkakil-api:local
    command: ["/app/simulator"]
    environment:
      SIM_API_URL: ${SIM_API_URL:-http://api:8080}
      CAMERA_API_KEY: ${CAMERA_API_KEY:?CAMERA_API_KEY zorunlu}
      DATABASE_URL: postgres://${POSTGRES_USER:-parkakil}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}@postgres:5432/${POSTGRES_DB:-parkakil}?sslmode=disable
      SIM_SEED: ${SIM_SEED:-20261026}
      SIM_EVENTS_PER_DAY: ${SIM_EVENTS_PER_DAY:-20000}
      SIM_SPEED: ${SIM_SPEED:-60}
      SIM_START: ${SIM_START:-}
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/simulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s

  providersim:
    image: parkakil-api:local
    command: ["/app/providersim"]
    environment:
      PROVIDERSIM_ADDR: ":8090"
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:?PROVIDER_WEBHOOK_SECRET zorunlu}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-30s}
      PROVIDERSIM_SEED: ${PROVIDERSIM_SEED:-4242}
    healthcheck:
      test: ["CMD", "/app/providersim", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${WEB_HOST_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
