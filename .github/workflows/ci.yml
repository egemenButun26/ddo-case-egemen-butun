name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt kontrolu
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt uygulanmasi gereken dosyalar:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      - name: testler ve kapsam
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
          PARKAKIL_REQUIRE_DB: "1"
        run: |
          go test -race -p 1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Kapsam"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bagimliliklari kur
        run: npm ci

      - name: Tip kontrolu
        run: npm run typecheck

      - name: Testler
        run: npm test

      - name: Uretim derlemesi
        run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: API imaji
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: false
          tags: parkakil-api:ci

      - name: Web imaji
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          tags: parkakil-web:ci

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ortami hazirla
        run: cp .env.example .env

      - name: Servisleri kaldir
        run: docker compose up -d --build --wait

      - name: API saglik kontrolu
        run: curl -fsS localhost:8080/health

      - name: Web uzerinden API
        run: curl -fsS localhost:3000/api/health

      - name: Loglar
        if: always()
        run: docker compose logs

      - name: Temizlik
        if: always()
        run: docker compose down -v --remove-orphans
